<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calle del Castellano + Hablar</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Castellano">
<meta name="theme-color" content="#1E3FA8">
<style>
:root{
  --bg:#F3F5FA; --surface:#FFFFFF; --ink:#16204A; --muted:#566089;
  --cobalt:#1E3FA8; --cobalt-soft:#E2E8FA; --ochre:#C98316; --ochre-soft:#FBEFD8;
  --good:#23704F; --good-soft:#DDF1E7; --bad:#A83232; --bad-soft:#F8E1E1; --line:#D3DAEC;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0C1330; --surface:#141D44; --ink:#E7EBFA; --muted:#9CA6CC;
    --cobalt:#86A2FF; --cobalt-soft:#1E2A5E; --ochre:#F0B44C; --ochre-soft:#3A2D14;
    --good:#61CC9C; --good-soft:#163A2C; --bad:#F28B8B; --bad-soft:#41191C; --line:#2B3670;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 64px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--ochre);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* The street-sign plaque: the one bold element */
.plaque{position:relative;background:var(--surface);border:3px solid var(--cobalt);border-radius:16px;
  padding:14px 22px 12px;box-shadow:0 0 0 5px var(--surface),0 0 0 7px var(--cobalt);margin:8px 6px 18px;text-align:center}
.plaque::before,.plaque::after{content:"";position:absolute;top:50%;width:12px;height:12px;background:var(--ochre);transform:translateY(-50%) rotate(45deg)}
.plaque::before{left:12px}.plaque::after{right:12px}
.plaque small{display:block;font-family:var(--serif);font-style:italic;color:var(--cobalt);font-size:1.05rem}
.plaque h1{margin:0;font-family:var(--serif);font-weight:700;color:var(--cobalt);font-size:clamp(2rem,7vw,3rem);letter-spacing:.02em;line-height:1.05}
.tagline{text-align:center;color:var(--muted);margin:0 0 18px;font-size:.95rem}

nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:20px;border-bottom:1px solid var(--line)}
nav button{background:none;border:none;padding:10px 14px;border-bottom:3px solid transparent;color:var(--muted);font-weight:600;white-space:nowrap}
nav button[aria-current="page"]{color:var(--cobalt);border-bottom-color:var(--ochre)}

h2{font-family:var(--serif);font-size:1.6rem;margin:0 0 6px}
h3{font-size:1.05rem;margin:22px 0 8px}
p{margin:0 0 12px}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:9px 14px;font-weight:600}
.btn:hover{border-color:var(--cobalt)}
.btn.primary{background:var(--cobalt);border-color:var(--cobalt);color:var(--surface)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--cobalt)}
.btn.again{border-color:var(--bad);color:var(--bad)}
.btn.almost{border-color:var(--ochre);color:var(--ochre)}
.btn.good{border-color:var(--good);color:var(--good)}
.btn:disabled{opacity:.45;cursor:default}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.9rem}
.chip[aria-pressed="true"]{background:var(--cobalt-soft);border-color:var(--cobalt);color:var(--cobalt);font-weight:600}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:none;background:var(--surface);padding:8px 12px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--cobalt);color:var(--surface)}
.kbd{font-size:.75rem;opacity:.7;margin-left:4px}

/* progress */
.stat{display:grid;grid-template-columns:9rem 1fr 4.5rem;gap:10px;align-items:center;margin:8px 0}
.bar{height:10px;background:var(--cobalt-soft);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--cobalt);border-radius:99px}
.stat b{text-align:right;font-variant-numeric:tabular-nums}
ol.plan{padding-left:1.3rem;margin:0}
ol.plan li{margin:6px 0}

/* flashcard */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px 20px;min-height:230px;
  display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:10px}
.card .cat{font-size:.82rem;color:var(--muted)}
.card .front{font-family:var(--serif);font-size:clamp(1.5rem,5vw,2.1rem);line-height:1.25}
.card .back{font-family:var(--serif);font-size:1.35rem;color:var(--cobalt)}
.card .note{background:var(--ochre-soft);color:var(--ink);border-radius:8px;padding:6px 10px;font-size:.92rem}
.card input{width:min(100%,420px);padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);text-align:center}
.typed{font-size:.95rem}
.typed.ok{color:var(--good)} .typed.no{color:var(--bad)}
.pbar{height:6px;background:var(--cobalt-soft);border-radius:99px;margin:10px 0 14px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--ochre)}
.grades{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.center{text-align:center}
.speak{border:none;background:var(--cobalt-soft);color:var(--cobalt);border-radius:999px;width:38px;height:38px;font-size:1.05rem;flex:none}
.speak.sm{width:30px;height:30px;font-size:.85rem}

/* list */
table.list{width:100%;border-collapse:collapse;font-size:.95rem}
table.list td{padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
table.list td:first-child{font-family:var(--serif);font-size:1.02rem}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--line);margin-right:6px}
.dot.l1,.dot.l2{background:var(--ochre)} .dot.l3,.dot.l4,.dot.l5{background:var(--good)}

/* verbs */
.vq{text-align:center}
.vq .inf{font-family:var(--serif);font-size:2.2rem;line-height:1.1}
.vq .gloss{color:var(--muted)}
.vq .who{font-size:1.25rem;margin-top:10px}
.vq .who strong{color:var(--cobalt)}
.tensetag{display:inline-block;background:var(--cobalt-soft);color:var(--cobalt);border-radius:8px;padding:2px 10px;font-weight:600;margin-top:6px}
.tensetag.spain{background:var(--ochre-soft);color:var(--ochre)}
.vin{display:block;margin:16px auto 8px;width:min(100%,360px);font-family:var(--serif);font-size:1.5rem;text-align:center;padding:10px;border:2px solid var(--line);border-radius:12px;background:var(--bg)}
.vin.ok{border-color:var(--good);background:var(--good-soft)} .vin.no{border-color:var(--bad);background:var(--bad-soft)}
.accents{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:10px}
.accents button{width:38px;height:38px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);font-family:var(--serif);font-size:1.1rem}
.fb{min-height:3.2em;margin-top:6px}
.fb .ok{color:var(--good);font-weight:600} .fb .no{color:var(--bad);font-weight:600} .fb .almost{color:var(--ochre);font-weight:600}
.fb .ans{font-family:var(--serif);font-size:1.3rem}
.ctable{width:100%;border-collapse:collapse;font-size:.95rem}
.ctable th,.ctable td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
.ctable td{font-family:var(--serif)}
.scroll{overflow-x:auto}
details.tip{background:var(--ochre-soft);border-radius:10px;padding:10px 14px;margin-top:14px}
details.tip summary{cursor:pointer;font-weight:600}

/* texts */
.tlist button{display:flex;width:100%;justify-content:space-between;align-items:center;gap:12px;text-align:left;background:var(--surface);
  border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.tlist .tt{font-family:var(--serif);font-size:1.15rem;font-weight:700}
.stars{color:var(--ochre);letter-spacing:2px;white-space:nowrap;font-size:.95rem}
.stars .off{color:var(--line)}
.levels{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.levels button{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 10px;font-size:.88rem;font-weight:600;color:var(--muted)}
.levels button[aria-pressed="true"]{border-color:var(--cobalt);color:var(--cobalt);background:var(--cobalt-soft)}
.levels button.done::after{content:" ✓";color:var(--good)}
.line{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.line .body{flex:1}
.line .who{font-size:.82rem;font-weight:700;color:var(--ochre)}
.line .es{font-family:var(--serif);font-size:1.22rem;line-height:1.75}
.line .en{color:var(--muted);font-size:.93rem;margin-top:2px}
.conn{background:var(--ochre-soft);border-radius:4px;padding:0 2px;box-shadow:inset 0 -2px 0 var(--ochre)}
.gap{border:none;border-bottom:2px solid var(--cobalt);background:var(--cobalt-soft);color:transparent;border-radius:4px 4px 0 0;
  font-family:var(--serif);font-size:inherit;padding:0 2px;line-height:1.2;min-width:2ch}
.gap.hint{color:var(--cobalt)}
.gap.shown{color:var(--ink);background:transparent;border-bottom-color:var(--good)}
.gap.conngap{border-bottom-color:var(--ochre);background:var(--ochre-soft)}
.recite{border:1.5px dashed var(--line);background:transparent;border-radius:8px;padding:6px 10px;color:var(--muted);font-size:.9rem;margin-top:6px}
.tbtn{border:none;background:none;color:var(--cobalt);font-size:.82rem;font-weight:600;padding:2px 0}
.personal{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.personal input,.fieldi{padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);width:100%}
label.sm{font-size:.85rem;color:var(--muted)}
.empty{text-align:center;padding:30px 10px}
/* conversation */
.okline{color:var(--good)} .badline{color:var(--bad)} .warnline{color:var(--ochre)}
.warnpanel{border-color:var(--ochre);background:var(--ochre-soft)}
.mrow{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.mrow span{flex:1}
.mrow input{margin-top:5px}
.chatbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;max-height:55vh;min-height:180px;overflow-y:auto;margin-bottom:10px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:10px 12px;border-radius:14px}
.msg .txt{font-family:var(--serif);font-size:1.12rem;line-height:1.45;white-space:pre-wrap}
.msg.ai{align-self:flex-start;background:var(--cobalt-soft);border-bottom-left-radius:4px}
.msg.me{align-self:flex-end;background:var(--ochre-soft);border-bottom-right-radius:4px}
.msg.err{background:var(--bad-soft)}
.msg .corr{margin-top:8px;padding-top:6px;border-top:1px dashed var(--line);font-size:.95rem}
.msg .en{color:var(--muted);font-size:.92rem;margin-top:6px}
.composer{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:10px}
.composer textarea{width:100%;font-family:var(--serif);font-size:1.1rem;padding:8px 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);resize:vertical;margin-bottom:8px}
.composer .accents{justify-content:flex-start}
@media (max-width:520px){ .stat{grid-template-columns:6.5rem 1fr 3.8rem} .grades .kbd{display:none} }
</style>
</head>

function parseRaw(raw, type){
  const cats = {};
  for(const [cat, block] of Object.entries(raw)){
    cats[cat] = block.trim().split('\n').filter(Boolean).map(l => {
      const [es, en, note] = l.split('|').map(x => (x||'').trim());
      return {id:type+':'+es, es, en, note, cat};
    });
  }
  return cats;
}

function pickVoice(){
  if(!('speechSynthesis' in window)) return;
  const vs = speechSynthesis.getVoices();
  const es = vs.filter(v => v.lang && v.lang.toLowerCase().startsWith('es'));
  esVoice = es.find(v => v.lang.replace('_','-').toLowerCase()==='es-es' && v.localService)
         || es.find(v => v.lang.replace('_','-').toLowerCase()==='es-es')
         || es.find(v => v.localService) || es[0] || null;
  if(current==='home') render();
}
function speak(text, rate){
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const clean = fill(text).replace(/\[[^\]]*\]/g,'').replace(/[«»]/g,'');
  const u = new SpeechSynthesisUtterance(clean);
  u.lang = 'es-ES'; if(esVoice) u.voice = esVoice;
  u.rate = rate || P.settings.rate || 0.9;

}

const INTERVAL = [0, 4*60e3, 25*60e3, 20*3600e3, 3*86400e3, 7*86400e3]; // box 0..5

function knownCount(deck){

}

const deckState = { words:null, phrases:null };
function deckSettings(deck){
  const k = 'deck_'+deck;
  if(!P.settings[k]) P.settings[k] = { cats: Object.keys(DECKS[deck]), dir:'es', size:20, mode:'study' };
  return P.settings[k];
}
function buildSession(deck){
  const st = deckSettings(deck), now = Date.now();
  const pool = st.cats.flatMap(c => DECKS[deck][c] || []);
  const dir = st.dir;
  const rec = c => P.cards[cardKey(c,dir)];
  const due = pool.filter(c => rec(c) && rec(c).due <= now).sort((a,b) => rec(a).due - rec(b).due);
  const fresh = pool.filter(c => !rec(c));
  let q = [...shuffle(due).slice(0, st.size)];
  if(q.length < st.size) q = q.concat(fresh.slice(0, st.size - q.length));
  if(q.length < st.size){
    const later = pool.filter(c => rec(c) && rec(c).due > now).sort((a,b) => rec(a).due - rec(b).due);
    q = q.concat(later.slice(0, st.size - q.length));
  }
  q = shuffle(q);
  deckState[deck] = { q, total:q.length, done:0, flipped:false, typed:'', stats:{again:0,almost:0,good:0}, dir };
}

      </div>
      ${st.mode==='study' ? `<div class="seg" role="group" aria-label="Direction">
        <button data-dir="es" aria-pressed="${st.dir==='es'}">Español → English</button>
        <button data-dir="en" aria-pressed="${st.dir==='en'}">English → Español</button>
      </div>` : ''}
    </div>

      ${cats.map(c => `<button class="chip" data-cat="${esc(c)}" aria-pressed="${st.cats.includes(c)}">${esc(c)} <span class="muted small">${DECKS[deck][c].length}</span></button>`).join('')}
    </div>`;
  if(st.mode==='list') return head + listView(deck);

  const c = S.q[0];

  if(S.flipped && st.dir==='en' && S.typed){

    <div class="card">
      <div class="cat">${esc(c.cat)}</div>

        <div class="front">${esc(front)}</div>
        ${st.dir==='es' ? speakBtn(c.es) : ''}
      </div>
      ${!S.flipped && st.dir==='en' ? `<input id="typein" placeholder="Type it in Spanish (optional), then Enter" autocomplete="off" autocapitalize="off" spellcheck="false" data-autofocus>` : ''}
      ${S.flipped ? `<div class="row" style="justify-content:center"><div class="back">${esc(back)}</div>${st.dir==='en' ? speakBtn(c.es) : ''}</div>${typedHtml}${c.note?`<div class="note">${esc(c.note)}</div>`:''}` : ''}

    ${st.dir==='en' && !S.flipped ? '' : ''}

function accentBar(show){
  if(!show) return '';

}
function grade(deck, g){
  const S = deckState[deck], st = deckSettings(deck), c = S.q.shift(), k = cardKey(c, st.dir), now = Date.now();
  const r = P.cards[k] || {b:0, due:0};
  S.stats[g]++;
  if(g==='again'){ r.b = 1; r.due = now + INTERVAL[1]; S.q.splice(Math.min(3, S.q.length), 0, c); }
  else if(g==='almost'){ r.b = Math.max(1, r.b); r.due = now + INTERVAL[r.b]; S.q.splice(Math.min(7, S.q.length), 0, c); }
  else { r.b = Math.min(5, r.b+1); r.due = now + INTERVAL[r.b]; S.done++; }
  P.cards[k] = r; save();
  S.flipped = false; S.typed = '';
  render();
}
function finishView(deck, S){
  const [k,n] = knownCount(deck);

// ===== VERBS =====
const ENDINGS = {
  pres:{ar:['o','as','a','amos','áis','an'], er:['o','es','e','emos','éis','en'], ir:['o','es','e','imos','ís','en']},
  pret:{ar:['é','aste','ó','amos','asteis','aron'], er:['í','iste','ió','imos','isteis','ieron'], ir:['í','iste','ió','imos','isteis','ieron']},
  imp:{ar:['aba','abas','aba','ábamos','abais','aban'], er:['ía','ías','ía','íamos','íais','ían'], ir:['ía','ías','ía','íamos','íais','ían']}
};
function conjugate(v, t){
  const inf = v.inf, type = strip(inf.slice(-2)), stem = inf.slice(0,-2);
  if(t==='pres') return v.pres || ENDINGS.pres[type].map(e => stem+e);
  if(t==='pret') return v.pret || ENDINGS.pret[type].map(e => stem+e);
  if(t==='imp') return v.imp || ENDINGS.imp[type].map(e => stem+e);
  const fs = v.fut || strip(inf);
  if(t==='fut') return ['é','ás','á','emos','éis','án'].map(e => fs+e);
  if(t==='cond') return ['ía','ías','ía','íamos','íais','ían'].map(e => fs+e);
  if(t==='perf'){ const part = v.part || stem + (type==='ar'?'ado':'ido'); return ['he','has','ha','hemos','habéis','han'].map(h => h+' '+part); }
  if(t==='subj'){
    if(v.subj) return v.subj;
    const base = conjugate(v,'pres')[0].slice(0,-1);
    return (type==='ar'?['e','es','e','emos','éis','en']:['a','as','a','amos','áis','an']).map(e => base+e);
  }
}
const isIrregular = v => ['pres','pret','imp','fut','part','subj'].some(k => v[k]);
const VS = { q:null, answered:false, result:null, retry:[], count:0, streak:0, tableVerb:'ser' };
function verbSettings(){
  if(!P.settings.verbs) P.settings.verbs = { tenses:['pres','perf','pret'], set:'all', mode:'drill' };
  return P.settings.verbs;
}
function nextVerbQ(){
  const st = verbSettings();
  VS.count++;
  const retryReady = VS.retry.find(r => VS.count - r.at >= 3);
  if(retryReady){ VS.retry = VS.retry.filter(r => r !== retryReady); VS.q = retryReady.q; }
  else {
    const verbs = VERBS.filter(v => st.set==='all' || (st.set==='irr' ? isIrregular(v) : !isIrregular(v)));
    const v = verbs[Math.floor(Math.random()*verbs.length)];
    const t = st.tenses[Math.floor(Math.random()*st.tenses.length)];
    const p = Math.floor(Math.random()*6);
    VS.q = {v, t, p};
  }
  VS.answered = false; VS.result = null;
}

  const setSeg = `<div class="seg" role="group" aria-label="Verb set">

      ${accentBar(!VS.answered)}

function checkVerb(giveUp){
  const {v,t,p} = VS.q, answer = conjugate(v,t)[p];
  const input = giveUp ? '' : ($('#vin').value || '');

  VS.last = input;
  const a = norm(input).replace(/^(yo|tú|tu|él|el|ella|usted|nosotros|nosotras|vosotros|vosotras|ellos|ellas|ustedes)\s+/,'');
  const target = norm(answer);
  VS.result = a===target ? 'ok' : (strip(a)===strip(target) ? 'accent' : 'no');
  VS.answered = true;
  const s = P.verbs[t] || {c:0,n:0}; s.n++; if(VS.result!=='no') s.c++; P.verbs[t] = s; save();

// ===== TEXTS =====
const LEVELS = ['Read','Connectors hidden','30% hidden','60% hidden','First letters','Recite'];
const TS = { open:null, level:0, seed:0, showEn:{}, revealed:{} };
const connRe = new RegExp('(?<!\\p{L})(' + [...CONNECTOR_PHRASES].sort((a,b)=>b.length-a.length).map(x => x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|') + ')(?!\\p{L})', 'giu');
function tokenize(sentence){
  const ranges = []; let m; connRe.lastIndex = 0;
  while((m = connRe.exec(sentence))) ranges.push([m.index, m.index + m[0].length]);
  const out = []; const re = /\p{L}+|[^\p{L}]+/gu; let t;
  while((t = re.exec(sentence))){
    const isW = /\p{L}/u.test(t[0]);
    out.push({t:t[0], w:isW, conn: isW && ranges.some(([a,b]) => t.index >= a && t.index < b)});
  }
  return out;
}
function renderSentence(textId, li, es, level){
  const toks = tokenize(fill(es));
  let wi = 0;
  return toks.map(tok => {
    if(!tok.w) return esc(tok.t);
    const key = `${textId}-${li}-${wi}`; const idx = wi++;
    if(level===0) return tok.conn ? `<span class="conn">${esc(tok.t)}</span>` : esc(tok.t);
    const ratio = level===2 ? .3 : level===3 ? .6 : 0;
    const hide = level===4 || tok.conn || (ratio && tok.t.length>1 && hash(key+':'+TS.seed) < ratio);
    if(!hide) return esc(tok.t);
    const shown = TS.revealed[key];
    const width = Math.max(2, tok.t.length) + 'ch';
    if(shown) return `<button class="gap shown ${tok.conn?'conngap':''}" style="min-width:${width}">${esc(tok.t)}</button>`;
    if(level===4) return `<button class="gap hint" data-reveal="${key}" title="Tap to reveal">${esc(tok.t[0])}${'_'.repeat(Math.max(1,tok.t.length-1))}</button>`;
    return `<button class="gap ${tok.conn?'conngap':''}" data-reveal="${key}" style="width:${width}" aria-label="Hidden word, tap to reveal">${esc(tok.t)}</button>`;
  }).join('');
}
function stars(n){ return `<span class="stars" aria-label="${n} of 5 levels">${[1,2,3,4,5].map(i => i<=n?'★':'<span class="off">★</span>').join('')}</span>`; }

  }

  return `<button class="btn ghost" data-act="tback" style="padding-left:0">← All texts</button>
    <h2>${esc(T.title)}</h2>

    <div class="row" style="margin-bottom:6px">

      ${lvl>=2 && lvl<=3 ? `<button class="btn" data-act="reshuffle">New gaps</button>` : ''}
      ${lvl>=1 && lvl<=4 ? `<button class="btn ghost" data-act="revealall">Reveal all</button>` : ''}
    </div>

document.addEventListener('click', e => {

  // decks
  const deck = (current==='words'||current==='phrases') ? current : null;
  if(deck){
    const st = deckSettings(deck);
    if(d.deckmode){ st.mode = d.deckmode; save(); return render(); }
    if(d.dir){ st.dir = d.dir; save(); buildSession(deck); return render(); }
    if(d.cat){ const c = d.cat; st.cats = st.cats.includes(c) ? st.cats.filter(x=>x!==c) : [...st.cats, c]; save(); buildSession(deck); return render(); }
    if(d.act==='flip'){ const ti = $('#typein'); deckState[deck].typed = ti ? ti.value : ''; deckState[deck].flipped = true; return render(); }
    if(d.grade) return grade(deck, d.grade);
    if(d.act==='newround'){ buildSession(deck); return render(); }
  }
  // verbs
  if(current==='verbs'){
    const st = verbSettings();
    if(d.vmode){ st.mode = d.vmode; save(); return render(); }
    if(d.tense){ st.tenses = st.tenses.includes(d.tense) ? st.tenses.filter(x=>x!==d.tense) : [...st.tenses, d.tense]; save(); VS.q=null; return render(); }
    if(d.vset){ st.set = d.vset; save(); VS.q=null; VS.retry=[]; return render(); }
    if(d.act==='vcheck') return checkVerb(false);
    if(d.act==='vskip') return checkVerb(true);
    if(d.act==='vnext'){ nextVerbQ(); return render(); }
  }
  // texts
  if(current==='texts'){
    if(d.open){ TS.open = d.open; TS.level = 0; TS.revealed = {}; TS.showEn = {}; TS.seed = 0; render(); return window.scrollTo(0,0); }
    if(d.act==='tback'){ TS.open = null; speechSynthesis && speechSynthesis.cancel(); return render(); }
    if(d.level){ TS.level = +d.level; TS.revealed = {}; TS.showEn = {}; return render(); }
    if(d.reveal){ TS.revealed[d.reveal] = true; return render(); }
    if(d.en){ TS.showEn[d.en] = true; return render(); }
    if(d.act==='reshuffle'){ TS.seed++; TS.revealed = {}; return render(); }
    if(d.act==='revealall'){ document.querySelectorAll('[data-reveal]').forEach(x => TS.revealed[x.dataset.reveal]=true); return render(); }
    if(d.act==='playall'){ const T = TEXTS.find(t=>t.id===TS.open); return speak(T.lines.map(l=>l[1]).join(' ')); }
    if(d.act==='levelup'){

      const done = TS.level===0 ? 0 : TS.level;

      save();
      if(TS.level<5){ TS.level++; TS.revealed={}; TS.showEn={}; render(); return window.scrollTo(0,0); }
      TS.open = null; return render();
    }
  }
  if(d.act==='reset'){
    if(confirm('Reset all progress? Your cards, verb stats, text levels, saved mistakes and conversation will be cleared.')){ P = {cards:{}, verbs:{}, texts:{}, settings:{ai:{ model: MODELS[0].id, scenario:'free', autoSpeak:false, useWords:true }}}; CHAT = []; refreshCustom(); save(); deckState.words = deckState.phrases = null; VS.q=null; render(); }
  }
});

// ----- prompts -----
function difficultWords(){
  const out = new Set();
  for(const [k, r] of Object.entries(P.cards)){
    if(r.b <= 1 && k.startsWith('w:')) out.add(k.slice(2).split('|')[0]);
  }
  return shuffle([...out]).slice(0, 8);
}
function instructions(){
  const s = SCENARIOS.find(x => x.id===P.settings.ai.scenario) || SCENARIOS[0];
  const words = P.settings.ai.useWords ? difficultWords() : [];
  return `Let's do a role-play so I can practise speaking Spanish. I am a learner at B1 level.
You are ${s.role}, in Madrid, Spain.
Situation: ${s.setting}
Rules:
1. Always answer in Spanish from Spain: use "vosotros", words like "vale", "coger", "móvil", and the pretérito perfecto for things that happened today.
2. Keep each reply short: one to three simple sentences.
3. End every reply with a question so the conversation continues.
4. If my last message had a grammar or vocabulary mistake, add a final line that starts with "Corrección:" followed by my corrected sentence. If there was no mistake, do not write that line.
5. Never write in English. Stay in character.${words.length ? `\n6. When it fits naturally, use some of these words I am learning: ${words.join(', ')}.` : ''}

Start now: say your first line to me, in character, in Spanish.`;
}
const REMINDER = '\n\n(Recuerda: responde en español de España, una a tres frases cortas, y termina con una pregunta. Si mi mensaje tiene un error, añade al final una línea "Corrección:" con mi frase corregida.)';
function payload(){
  let msgs = CHAT.filter(m => !m.error).map(m => ({role:m.role, content:m.content}));
  if(msgs.length > 13) msgs = [msgs[0], ...msgs.slice(-12)];
  const last = msgs[msgs.length-1];
  if(last && last.role==='user' && msgs.length > 1) msgs[msgs.length-1] = {role:'user', content:last.content + REMINDER};
  return msgs;
}
function parseReply(txt, lastUser){
  const t = txt.replace(/<think>[\s\S]*?<\/think>/g,'').trim();
  const parts = t.split(/\n?[ \t]*[*_]*[ \t]*Correcci[oó]n[ \t]*[*_]*[ \t]*:[ \t]*/i);
  let reply = parts[0].trim();
  let corr = parts.slice(1).join(' ').replace(/[*_]/g,'').split('\n')[0].trim();
  if(corr && (/^(ninguna|no hay|nada|none|n\/a|-)/i.test(corr) || (lastUser && strip(norm(corr))===strip(norm(lastUser))))) corr = '';
  if(!reply && corr){ reply = corr; corr = ''; }
  return {reply, corr};
}

// ----- generation -----
async function generate(){
  if(!AI.engine || AI.generating) return;
  AI.generating = true;
  const lastUser = [...CHAT].reverse().find(m => m.role==='user' && !m.hidden);
  const messages = payload();
  CHAT.push({role:'assistant', content:'', show:''});
  const idx = CHAT.length - 1;
  renderTalkMessages();
  let txt = '';
  try {
    const chunks = await AI.engine.chat.completions.create({ messages, stream:true, temperature:0.7, max_tokens:220 });
    for await (const ch of chunks){
      txt += (ch.choices[0] && ch.choices[0].delta && ch.choices[0].delta.content) || '';
      const el = document.querySelector(`#msg-${idx} .txt`);
      if(el){ el.textContent = parseReply(txt).reply || '…'; scrollChat(); }
    }
    let {reply, corr} = parseReply(txt, lastUser && lastUser.show);
    if(!lastUser) corr = '';
    CHAT[idx] = {role:'assistant', content: txt.replace(/<think>[\s\S]*?<\/think>/g,'').trim() || reply, show: reply, corr};
    if(P.settings.ai.autoSpeak) speak(reply);
  } catch(e){
    CHAT[idx] = {role:'assistant', content:'', show:'The model stopped with an error: ' + (e.message||e), error:true};
  }
  AI.generating = false;
  saveChat();
  render();
}
async function oneShot(prompt, maxTokens=160){
  const r = await AI.engine.chat.completions.create({ messages:[{role:'user', content:prompt}], temperature:0.2, max_tokens:maxTokens });
  return ((r.choices[0] && r.choices[0].message && r.choices[0].message.content) || '').replace(/<think>[\s\S]*?<\/think>/g,'').trim();
}
async function translateMsg(i){
  if(AI.generating) return;
  AI.generating = true; CHAT[i].en = '…'; render();
  try { CHAT[i].en = await oneShot(`Translate this Spanish text into English. Reply with only the English translation.\n\n${CHAT[i].show}`); }
  catch(e){ CHAT[i].en = 'Translation failed.'; }
  AI.generating = false; saveChat(); render();
}
async function suggestReply(){
  if(AI.generating) return;
  const s = SCENARIOS.find(x => x.id===P.settings.ai.scenario) || SCENARIOS[0];
  const convo = CHAT.filter(m => !m.hidden && !m.error).slice(-6).map(m => (m.role==='user'?'Learner: ':'Other person: ') + m.show).join('\n');
  AI.generating = true; render();
  try {
    let sug = await oneShot(`A Spanish learner (B1) is in this role-play situation in Madrid: ${s.setting}\nConversation so far:\n${convo}\n\nWrite one short, natural reply in Spanish from Spain that the learner could say next. Reply with only that sentence, nothing else.`, 80);
    sug = sug.replace(/^(Learner|Aprendiz|Tú)\s*:\s*/i,'').replace(/^["«“]|["»”]$/g,'').split('\n')[0];
    AI.draft = sug;
  } catch(e){}
  AI.generating = false; render();
}
function startConversation(){
  if(AI.generating) return;
  CHAT = [{role:'user', content: instructions(), show:'', hidden:true}];
  saveChat(); render(); generate();
}
function sendMessage(){
  const ta = $('#chatin'); const text = (ta ? ta.value : AI.draft).trim();
  if(!text || AI.generating) return;
  if(!CHAT.length) { CHAT = [{role:'user', content: instructions(), show:'', hidden:true}]; }
  CHAT.push({role:'user', content:text, show:text});
  AI.draft = '';
  saveChat(); generate();
}
function saveMistake(i){
  const m = CHAT[i]; if(!m || !m.corr) return;
  const said = [...CHAT.slice(0,i)].reverse().find(x => x.role==='user' && !x.hidden);
  if(!P.custom) P.custom = [];
  const id = 'p:' + m.corr;
  if(!P.custom.some(c => c.id===id)) P.custom.push({id, es:m.corr, en:'You said: ' + (said ? said.show : '…'), note:'From a conversation. Say the corrected sentence.', cat:'My mistakes'});
  m.saved = true;
  refreshCustom();
  const st = deckSettings('phrases'); if(!st.cats.includes('My mistakes')) st.cats.push('My mistakes');
  deckState.phrases = null;
  saveChat(); render();
}
function refreshCustom(){
  if(P.custom && P.custom.length) DECKS.phrases['My mistakes'] = P.custom.map(c => Object.assign({}, c, {cat:'My mistakes'}));
  else delete DECKS.phrases['My mistakes'];
}
refreshCustom();
function scrollChat(){ const box = $('#chatbox'); if(box) box.scrollTop = box.scrollHeight; }

// ----- views -----
function talkView(){
  checkEnvironment();
  if(AI.status!=='ready' || AI.showSetup) return setupView();
  return chatView();
}
function setupView(){
  const gpuMsg = {
    checking:'Checking whether this browser can run AI models…',
    ok:'✓ This browser can run AI models (WebGPU is available).',
    none:'✗ This browser can’t run AI models: WebGPU isn’t available. On iPhone and iPad you need iOS / iPadOS 26 or later.',
    noadapter:'✗ WebGPU exists but the browser didn’t give access to the graphics chip. Try restarting the browser.'
  }[AI.gpu] || '';
  const local = !location.protocol.startsWith('http');
  const sel = P.settings.ai.model;
  return `<h2>Hablar</h2>
  <p class="muted">Role-play conversations with an AI that runs entirely on this device, with no internet once it’s downloaded. It plays a character from the situations in Textos, keeps replies short, and corrects your mistakes.</p>
  ${AI.status==='ready' ? `<div class="row" style="margin-bottom:10px"><button class="btn" data-ai="backchat">← Back to the conversation</button></div>` : ''}
  <div class="panel">
    <h3 style="margin-top:0">Device check</h3>
    <p class="${AI.gpu==='ok'?'okline':(AI.gpu==='checking'?'':'badline')}">${gpuMsg}</p>
    ${local ? `<p class="badline">✗ This page was opened as a local file. The AI part only works when the page is opened from a web address (see the setup steps that came with this file). Everything else still works.</p>` : ''}
    ${isIOS && !isStandalone && !local ? `<p class="warnline">Open this page from its Home Screen icon before downloading a model. The Home Screen app keeps its own storage, so a model downloaded in a Safari tab won’t be there.</p>` : ''}
    ${AI.libError ? `<p class="badline">The AI library didn’t load: ${esc(AI.libError)}</p>` : ''}
  </div>
  ${crashedWhileLoading ? `<div class="panel warnpanel"><b>Last time, the page restarted while loading ${esc((MODELS.find(m=>m.id===crashedWhileLoading)||{}).name||'a model')}.</b> That usually means the device ran out of memory. Try a smaller model and close other apps first.</div>` : ''}
  <div class="panel">
    <h3 style="margin-top:0">Choose a model</h3>
    ${MODELS.map(m => `<label class="mrow">
        <input type="radio" name="model" value="${m.id}" ${m.id===sel?'checked':''}>
        <span><b>${m.name}</b> <span class="small muted">${m.mem}${AI.cached[m.id]?' · downloaded':''}</span><br><span class="small">${m.note}</span></span>
        ${AI.cached[m.id] ? `<button class="btn ghost small" data-ai="delete" data-id="${m.id}">Delete</button>` : ''}
      </label>`).join('')}
    <p class="small muted" style="margin-top:10px">The first time, the model downloads once (use wifi). After that it loads from the device, even in airplane mode. Loading takes a little while each time you open the app.</p>
    ${AI.status==='loading' ? `<div id="aiprog" class="bar" style="margin:10px 0"><i style="width:${Math.round(AI.progress*100)}%"></i></div><p id="aiprogtxt" class="small muted">${esc(AI.progText)}</p>`
      : `<button class="btn primary" data-ai="load" ${AI.gpu!=='ok'||local?'disabled':''}>${AI.cached[sel] ? 'Load model' : 'Download and load model'}</button>`}
    ${AI.status==='error' ? `<p class="badline" style="margin-top:10px">Loading failed: ${esc(AI.error)}</p><p class="small">If this mentions memory or the device, try a smaller model. If it mentions the network, connect to wifi and try again.</p>` : ''}
  </div>`;
}
function chatView(){
  const s = P.settings.ai;
  const scn = SCENARIOS.find(x => x.id===s.scenario) || SCENARIOS[0];
  const visible = CHAT.map((m,i) => [m,i]).filter(([m]) => !m.hidden);
  return `<h2>Hablar</h2>
  <div class="row small muted" style="justify-content:space-between;margin-bottom:10px">
    <span>Model: ${esc((MODELS.find(m=>m.id===AI.loadedId)||{}).name||'')}</span>
    <button class="btn ghost small" data-ai="setup">Change model</button>
  </div>
  <div class="panel">
    <label class="sm" for="scn">Situation</label>
    <select id="scn" class="fieldi">${SCENARIOS.map(x => `<option value="${x.id}" ${x.id===s.scenario?'selected':''}>${esc(x.title)}</option>`).join('')}</select>
    <p class="small" style="margin:8px 0">Your goal: ${esc(scn.goal)}</p>
    <div class="row">
      <button class="btn primary" data-ai="start" ${AI.generating?'disabled':''}>${CHAT.length ? 'Start a new conversation' : 'Start the conversation'}</button>
      <label class="small"><input type="checkbox" id="autospeak" ${s.autoSpeak?'checked':''}> Read replies aloud</label>
      <label class="small"><input type="checkbox" id="usewords" ${s.useWords?'checked':''}> Use words I’m struggling with</label>
    </div>
  </div>
  <div id="chatbox" class="chatbox">${renderMsgs(visible)}</div>
  <div class="composer">
    <textarea id="chatin" rows="2" placeholder="Escribe en español… (you can dictate with the microphone on your keyboard)" autocapitalize="sentences">${esc(AI.draft)}</textarea>
    ${accentBar(true)}
    <div class="row" style="justify-content:space-between">
      <button class="btn ghost" data-ai="suggest" ${AI.generating||!CHAT.length?'disabled':''}>Help me answer</button>
      ${AI.generating ? `<button class="btn" data-ai="stop">Stop</button>` : `<button class="btn primary" data-ai="send">Send</button>`}
    </div>
  </div>
  <p class="small muted">A small model’s Spanish isn’t perfect, and its corrections can be wrong. When it disagrees with Frases or Textos, trust those.</p>`;
}
function renderMsgs(visible){
  if(!visible.length) return `<div class="empty small muted">Pick a situation and start the conversation. The other person speaks first.</div>`;
  return visible.map(([m,i]) => m.role==='user'
    ? `<div class="msg me" id="msg-${i}"><div class="txt">${esc(m.show)}</div></div>`
    : `<div class="msg ai ${m.error?'err':''}" id="msg-${i}">
        <div class="txt">${esc(m.show || '…')}</div>
        ${m.corr ? `<div class="corr"><b>Corrección:</b> ${esc(m.corr)} ${m.saved ? '<span class="small okline">saved to Frases › My mistakes</span>' : `<button class="tbtn" data-ai="save" data-i="${i}">Save as a card</button>`}</div>` : ''}
        ${m.en ? `<div class="en">${esc(m.en)}</div>` : ''}
        ${m.show && !m.error ? `<div class="row" style="gap:4px;margin-top:4px">${speakBtn(m.show,'sm')}${m.en?'':`<button class="tbtn" data-ai="translate" data-i="${i}" ${AI.generating?'disabled':''}>EN</button>`}</div>` : ''}
      </div>`).join('');
}
function renderTalkMessages(){
  const box = $('#chatbox'); if(!box) return render();
  box.innerHTML = renderMsgs(CHAT.map((m,i)=>[m,i]).filter(([m]) => !m.hidden));
  scrollChat();
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-ai]'); if(!b || current!=='talk') return;
  const a = b.dataset.ai;
  if(a==='load'){ const r = document.querySelector('input[name="model"]:checked'); return loadModel(r ? r.value : MODELS[0].id); }
  if(a==='delete'){ e.preventDefault(); return deleteModel(b.dataset.id); }
  if(a==='setup'){ AI.showSetup = true; return render(); }
  if(a==='backchat'){ AI.showSetup = false; return render(); }
  if(a==='start') return startConversation();
  if(a==='send') return sendMessage();
  if(a==='stop'){ try { AI.engine.interruptGenerate(); } catch(err){} return; }
  if(a==='suggest') return suggestReply();
  if(a==='translate') return translateMsg(+b.dataset.i);
  if(a==='save') return saveMistake(+b.dataset.i);
});
document.addEventListener('change', e => {
  if(current!=='talk') return;
  if(e.target.name==='model'){ P.settings.ai.model = e.target.value; save(); render(); }
  if(e.target.id==='scn'){ P.settings.ai.scenario = e.target.value; save(); render(); }
  if(e.target.id==='autospeak'){ P.settings.ai.autoSpeak = e.target.checked; save(); }
  if(e.target.id==='usewords'){ P.settings.ai.useWords = e.target.checked; save(); }
});
document.addEventListener('input', e => { if(e.target.id==='chatin') AI.draft = e.target.value; });
document.addEventListener('keydown', e => {
  if(current==='talk' && e.target.id==='chatin' && e.key==='Enter' && !e.shiftKey && !isIOS){ e.preventDefault(); sendMessage(); }
});

render();
if('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }

</script>
<script>
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  navigator.serviceWorker.register('./sw.js').catch(function(){});
}
</script>
